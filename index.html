5%{opacity:.18}
50%{transform:translateY(50vh) rotate(-20deg) scale(1.05);opacity:.22}
95%{opacity:.18}
100%{transform:translateY(110vh) rotate(-40deg) scale(1);opacity:0}

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

let db=null;
let collection=null;
let getDocs=null;
let updateDoc=null;
let doc=null;
let increment=null;

try{

const firebaseModule=await import('./firebase.js');

db=firebaseModule.db;

const firestoreModule=
await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

collection=firestoreModule.collection;
getDocs=firestoreModule.getDocs;
updateDoc=firestoreModule.updateDoc;
doc=firestoreModule.doc;
increment=firestoreModule.increment;

}catch(error){

console.warn("Firebase not available:",error);

}

/* =========================================================
   SETTINGS
========================================================= */

const OWNER_PHONE="2347034447700";

const hamburger=document.getElementById("hamburger");
const mobileMenu=document.getElementById("mobileMenu");

hamburger.addEventListener("click",()=>{
hamburger.classList.toggle("active");
mobileMenu.classList.toggle("active");
});

document.addEventListener("click",(e)=>{
if(!hamburger.contains(e.target)&&!mobileMenu.contains(e.target)){
hamburger.classList.remove("active");
mobileMenu.classList.remove("active");
}
});

/* =========================================================
   ELEMENTS
========================================================= */

const container=document.getElementById("products");
const modal=document.getElementById("imageModal");
const modalImage=document.getElementById("modalImage");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const closeBtn=document.getElementById("closeBtn");
const imageCounter=document.getElementById("imageCounter");

let currentProductImages=[];
let currentImageIndex=0;
let allProducts=[];
let productStats={};
let userLikes={};

/* =========================================================
   IMPORTANT PRICE FIX
   Firestore prices may be strings OR numbers.
========================================================= */

function getProductPrice(value){

if(value===undefined||value===null||value===""){
return 0;
}

if(typeof value==="number"){
return Number.isFinite(value)?value:0;
}

let cleaned=String(value)
.replace(/₦/gi,"")
.replace(/NGN/gi,"")
.replace(/,/g,"")
.replace(/\s/g,"")
.trim();

const number=Number(cleaned);

return Number.isFinite(number)?number:0;
}

function formatPrice(value){

const price=getProductPrice(value);

return price.toLocaleString("en-NG",{
maximumFractionDigits:2
});

}

/* =========================================================
   IMAGE GALLERY
========================================================= */

function openImageGallery(images,index=0){

currentProductImages=images.filter(
url=>url&&String(url).trim()!=""
);

if(!currentProductImages.length){
console.warn("No valid images");
return;
}

currentImageIndex=index;

modalImage.src=currentProductImages[currentImageIndex];

updateImageCounter();

modal.style.display="block";

document.body.style.overflow="hidden";
}

function closeModal(){

modal.style.display="none";
document.body.style.overflow="auto";

}

function updateImageCounter(){

if(currentProductImages.length>1){

imageCounter.textContent=
`${currentImageIndex+1} / ${currentProductImages.length}`;

imageCounter.style.display="block";

prevBtn.style.display="block";
nextBtn.style.display="block";

}else{

imageCounter.style.display="none";
prevBtn.style.display="none";
nextBtn.style.display="none";

}

}

function changeImage(direction){

if(currentProductImages.length<=1)return;

currentImageIndex+=direction;

if(currentImageIndex>=currentProductImages.length){
currentImageIndex=0;
}

if(currentImageIndex<0){
currentImageIndex=currentProductImages.length-1;
}

modalImage.src=currentProductImages[currentImageIndex];

updateImageCounter();

}

prevBtn.addEventListener("click",(e)=>{
e.stopPropagation();
changeImage(-1);
});

nextBtn.addEventListener("click",(e)=>{
e.stopPropagation();
changeImage(1);
});

closeBtn.addEventListener("click",closeModal);

modal.addEventListener("click",(e)=>{
if(e.target===modal)closeModal();
});

document.addEventListener("keydown",(e)=>{

if(modal.style.display==="block"){

if(e.key==="ArrowLeft")changeImage(-1);
if(e.key==="ArrowRight")changeImage(1);
if(e.key==="Escape")closeModal();

}

});

/* =========================================================
   SHARE
========================================================= */

function createShareCard(productId){

const product=allProducts.find(p=>p.id===productId);

if(!product)return null;

const name=product.name||"Product";
const price=getProductPrice(product.price);
const desc=product.description||"";

const image=
Array.isArray(product.imageUrls)&&product.imageUrls[0]
?product.imageUrls[0]:"";

const productUrl=
window.location.origin+
window.location.pathname+
"#product-"+productId;

return{
name,
price,
desc,
image,
url:productUrl
};

}

if(!data)return;

text+=`📸 *Product Image:*\n${image}\n\n`;
}

text+=
`🔗 *View on Store:*\n${url}\n\n`+
`✨ *Akeem Store - Quality Products*`;

`https://wa.me/?text=${encodeURIComponent(text)}`,

);

}

else if(platform==="facebook"){

const text=
`🛍️ Check out this amazing product!\n\n`+
`📦 ${name}\n`+
`💰 Price: ₦${formatPrice(price)}\n\n`+
`${desc}\n\n`+
`Visit Akeem Store: ${url}`;

window.open(
`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(text)}`,

);

}

else if(platform==="instagram"){

`🛍️ CHECK THIS OUT! 🛍️\n\n`+
`📦 ${name}\n`+
`💰 ₦${formatPrice(price)}\n\n`+
`${desc}\n\n`+

else if(platform==="copy"){

`.share-menu[data-product-id="${productId}"]`
);

window.toggleShareMenu=function(productId,event){

event.stopPropagation();

const menu=document.querySelector(
`.share-menu[data-product-id="${productId}"]`
);

document.querySelectorAll(".share-menu.active").forEach(m=>{

if(m.getAttribute("data-product-id")!==productId){
m.classList.remove("active");
}

});

if(menu)menu.classList.toggle("active");

};

/* =========================================================
   LIKES
========================================================= */

window.handleLike=async function(productId){

try{

if(!productStats[productId]){
productStats[productId]={views:0,likes:0};
}

if(!db||!updateDoc||!doc||!increment){

userLikes[productId]=!userLikes[productId];

if(userLikes[productId]){
productStats[productId].likes++;
}else{
productStats[productId].likes=
Math.max(0,productStats[productId].likes-1);
}

updateLikeUI(productId);
updateStats();

return;

}

if(userLikes[productId]){

userLikes[productId]=false;

await updateDoc(
doc(db,"products",productId),
{likes:increment(-1)}
);

productStats[productId].likes=
Math.max(0,productStats[productId].likes-1);

}else{

userLikes[productId]=true;

await updateDoc(
doc(db,"products",productId),
{likes:increment(1)}
);

productStats[productId].likes++;

}

updateLikeUI(productId);
updateStats();

}catch(error){

console.error("Error updating like:",error);

}

};

function updateLikeUI(productId){

const btn=document.querySelector(
`.like-button[data-product-id="${productId}"]`
);

const count=document.querySelector(
`.like-count[data-product-id="${productId}"]`
);

if(btn){

btn.textContent=
userLikes[productId]?"❤️":"🤍";

btn.classList.toggle(
"liked",
!!userLikes[productId]
);

}

if(count){

count.textContent=
"❤️ "+(productStats[productId]?.likes||0);

}

}

/* =========================================================
   STATS
========================================================= */

function updateStats(){

const views=
Object.values(productStats)
.reduce(
(sum,p)=>sum+(Number(p.views)||0),
0
);

const likes=
Object.values(productStats)
.reduce(
(sum,p)=>sum+(Number(p.likes)||0),
0
);

document.getElementById("totalProductsStat")
.textContent=allProducts.length;

document.getElementById("totalViewsStat")
.textContent=views.toLocaleString();

document.getElementById("totalLikesStat")
.textContent=likes.toLocaleString();

/*
Generated browsing number.
This is intentionally NOT a real active-user count.
*/

const generatedOnline=
Math.floor(Math.random()*20)+5;

document.getElementById("onlineNowStat")
.textContent=generatedOnline;

}

/* =========================================================
   VIEW TRACKING
========================================================= */

async function trackView(productId){

try{

if(!productStats[productId]){
productStats[productId]={views:0,likes:0};
}

if(!db||!updateDoc||!doc||!increment)return;

await updateDoc(
doc(db,"products",productId),
{views:increment(1)}
);

productStats[productId].views++;

updateStats();

}catch(error){

console.error("Error tracking view:",error);

}

}

/* =========================================================
   PRODUCT IMAGE
========================================================= */

window.openProductImage=function(productId){

const product=
allProducts.find(p=>p.id===productId);

if(!product||!Array.isArray(product.imageUrls)){
return;
}

const images=product.imageUrls.filter(url=>{

if(!url||!String(url).trim())return false;

const lower=String(url).toLowerCase();

if(
lower.includes(".mp4")||
lower.includes(".webm")||
lower.includes("video")
){
return false;
}

return true;

});

if(images.length){

openImageGallery(images,0);

trackView(productId);

}else{

alert("No images available for this product.");

}

};

/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(products){

container.innerHTML="";

if(!products.length){

container.innerHTML=`
<div style="
width:100%;
text-align:center;
padding:60px 20px;
color:rgba(255,255,255,.75);
font-size:18px;
">
No products found.
</div>`;

}

products.forEach(product=>{

const productId=product.id;

const isSold=product.sold===true;

if(!productStats[productId]){

productStats[productId]={
views:Number(product.views)||0,
likes:Number(product.likes)||0
};

}

const views=
Number(productStats[productId].views)||0;

const likes=
Number(productStats[productId].likes)||0;

const images=
Array.isArray(product.imageUrls)
?product.imageUrls.filter(
url=>url&&String(url).trim()!=""
):[];

const firstImage=images[0]||"";

const lowerImage=
String(firstImage).toLowerCase();

const isVideo=
lowerImage.includes(".mp4")||
lowerImage.includes(".webm")||
lowerImage.includes("video");

const price=
getProductPrice(product.price);

const formattedPrice=
formatPrice(price);

let imageHTML="";

if(firstImage){

if(isVideo){

imageHTML=`

src="${firstImage}"

style="width:100%;height:100%;object-fit:cover"

</video>

</div>

class="image-container"

`<div class="image-counter">${images.length} items</div>`:""}

}else{

imageHTML=`
<div
class="image-container"
style="
background:#f0f0f0;
display:flex;
align-items:center;
justify-content:center;

<span style="color:#999">
No image
</span>

product.name||"Unnamed Product";

const description=
product.description||"";

const whatsappLink=
`https://wa.me/${OWNER_PHONE}?text=${
encodeURIComponent(
`I'm interested in: ${productName} - ₦${formattedPrice}`

container.innerHTML+=`

<div
class="product ${isSold?"sold":""}"

`<div class="sold-badge">SOLD</div>`:""}

📤
</button>

class="share-menu"

class="share-option whatsapp"

📱
</button>

f
</button>

📷
</button>

Sold Out

:

/* =========================================================
   ESCAPE PRODUCT TEXT
========================================================= */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* =========================================================
   SEARCH
========================================================= */

const searchBox=
document.getElementById("searchBox");

searchBox.addEventListener("input",(e)=>{

const search=
e.target.value.toLowerCase().trim();

if(!search){

renderProducts(allProducts);

return;

}

const filtered=
allProducts.filter(product=>{

const name=
String(product.name||"").toLowerCase();

const description=
String(product.description||"").toLowerCase();

const price=
String(product.price||"").toLowerCase();

return(
name.includes(search)||
description.includes(search)||
price.includes(search)
);

});

renderProducts(filtered);

});

/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

if(!db||!getDocs||!collection){

container.innerHTML=`
<p style="
text-align:center;
color:white;
padding:50px;
width:100%;
">
Firebase not configured
</p>`;

return;

}

try{

const snap=
await getDocs(collection(db,"products"));

allProducts=[];
productStats={};

snap.forEach(docSnap=>{

const data=docSnap.data();

allProducts.push({
...data,
id:docSnap.id
});

productStats[docSnap.id]={
views:Number(data.views)||0,
likes:Number(data.likes)||0
};

});

console.log(
"Products loaded:",
allProducts.length
);

console.log(
"Products and prices:",
allProducts.map(p=>({
name:p.name,
price:p.price,
normalizedPrice:getProductPrice(p.price)
}))
);

updateStats();

updateActivityFeed();

renderProducts(allProducts);

}catch(error){

console.error(
"Error loading products:",
error
);

container.innerHTML=`
<div style="
width:100%;
text-align:center;
padding:60px 20px;
color:#fff;
">

<h3 style="margin-bottom:10px">
Unable to load products
</h3>

<p style="opacity:.7">
Please refresh the page.
</p>

</div>`;

}

}

Refresh generated browsing number periodically.

*/

setInterval(()=>{

const generatedOnline=
Math.floor(Math.random()*20)+5;

document.getElementById("onlineNowStat")
.textContent=generatedOnline;

},10000);

/* =========================================================
   START
========================================================= */

loadProducts();

</script>
