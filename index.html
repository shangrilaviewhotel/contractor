const firebaseConfig={apiKey:"AIzaSyDhwIAmuZrY5Xqo6Ql7LDKxrPiklpG5GTE",authDomain:"shangrila-booking.firebaseapp.com",projectId:"shangrila-booking",storageBucket:"shangrila-booking.firebasestorage.app",messagingSenderId:"981170210173",appId:"1:981170210173:web:4d74cb3f6109fe1c0a3814",measurementId:"G-ZYB3J8BW72"};
const db=getFirestore(initializeApp(firebaseConfig));
const OWNER_PHONE="2347034447700";
const container=document.getElementById("products"),searchBox=document.getElementById("searchBox"),sortSelect=document.getElementById("sortSelect"),categoryList=document.getElementById("categoryList"),resultsCount=document.getElementById("resultsCount"),clearFilters=document.getElementById("clearFilters"),hamburger=document.getElementById("hamburger"),mobileMenu=document.getElementById("mobileMenu");
let allProducts=[],productStats={},userLikes={},selectedCategory="all",currentSearch="",currentSort="default";
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function getProductCategory(p){return p.category||p.Category||p.productCategory||p.type||"Other"}
function normalizeCategory(c){const v=String(c||"Other").trim().toLowerCase();const map={car:"Cars",cars:"Cars",vehicle:"Cars",vehicles:"Cars",house:"Houses",houses:"Houses",property:"Houses",properties:"Houses",realestate:"Houses",hotel:"Hotels",hotels:"Hotels",ship:"Ships",ships:"Ships",boat:"Ships",boats:"Ships",tractor:"Tractors",tractors:"Tractors",generator:"Generators",generators:"Generators","heavy equipment":"Heavy Equipment",heavyequipment:"Heavy Equipment",equipment:"Heavy Equipment",other:"Other"};return map[v]||String(c||"Other").trim()||"Other"}
function getProductDate(p){const x=p.createdAt||p.created_at||p.timestamp||p.date||0;if(x?.seconds)return Number(x.seconds)*1000;if(x?.toDate){try{return x.toDate().getTime()}catch{}}const d=new Date(x).getTime();return Number.isNaN(d)?0:d}
function generatedOnlineNumber(){return Math.floor(Math.random()*20)+5}
function updateStats(){const views=Object.values(productStats).reduce((s,p)=>s+(Number(p.views)||0),0),likes=Object.values(productStats).reduce((s,p)=>s+(Number(p.likes)||0),0);document.getElementById("totalProductsStat").textContent=allProducts.length;document.getElementById("totalViewsStat").textContent=views.toLocaleString();document.getElementById("onlineNowStat").textContent=generatedOnlineNumber();document.getElementById("totalLikesStat").textContent=likes.toLocaleString()}
function updateActivityFeed(){const list=document.getElementById("activityList");if(!list)return;list.innerHTML="";["Lagos","Abuja","Port Harcourt","Kano","Ibadan"].forEach((location,i)=>{const el=document.createElement("div");el.className="activity-item";el.innerHTML=`<strong>${location}</strong> ${["❤️ liked a product","👁 viewed a listing","📤 shared a product","🎯 interested in a product"][i%4]}<span style="color:rgba(255,255,255,.5);font-size:10px;display:block">${i+1} min ago</span>`;list.appendChild(el)})}
function buildCategories(){const counts={};allProducts.forEach(p=>{const c=normalizeCategory(getProductCategory(p));counts[c]=(counts[c]||0)+1});categoryList.innerHTML="";const icons={Cars:"🚗",Houses:"🏠",Hotels:"🏨",Ships:"🚢",Tractors:"🚜",Generators:"⚡","Heavy Equipment":"🏗️",Other:"📦"};const add=(id,label,count)=>{const b=document.createElement("button");b.className="category-btn"+(id===selectedCategory?" active":"");b.dataset.category=id;b.textContent=`${icons[id]||"🛍️"} ${label}${count!=null?` (${count})`:""}`;b.onclick=()=>{selectedCategory=id;buildCategories();applyFilters()};categoryList.appendChild(b)};add("all","All Products",allProducts.length);Object.keys(counts).sort().forEach(c=>add(c,c,counts[c]))}
function getFilteredProducts(){let p=[...allProducts];if(selectedCategory!=="all")p=p.filter(x=>normalizeCategory(getProductCategory(x))===selectedCategory);if(currentSearch)p=p.filter(x=>`${x.name||""} ${x.description||""} ${getProductCategory(x)||""} ${x.location||""} ${x.brand||""} ${x.model||""} ${x.price||""}`.toLowerCase().includes(currentSearch));p.sort((a,b)=>{if(currentSort==="priceLow")return(Number(a.price)||0)-(Number(b.price)||0);if(currentSort==="priceHigh")return(Number(b.price)||0)-(Number(a.price)||0);if(currentSort==="newest")return getProductDate(b)-getProductDate(a);if(currentSort==="views")return(Number(productStats[b.id]?.views)||0)-(Number(productStats[a.id]?.views)||0);if(currentSort==="likes")return(Number(productStats[b.id]?.likes)||0)-(Number(productStats[a.id]?.likes)||0);return 0});return p}
function applyFilters(){const p=getFilteredProducts();renderProducts(p);resultsCount.textContent=`Showing ${p.length} of ${allProducts.length} products • ${selectedCategory==="all"?"all categories":selectedCategory}`;clearFilters.classList.toggle("show",selectedCategory!=="all"||currentSearch!==""||currentSort!=="default")}
function renderProducts(products){container.innerHTML="";if(!products.length){container.innerHTML=`<div class="no-results"><div class="no-results-icon">🔎</div><h3>No Products Found</h3><p>There are no products matching your current search or category.</p><br><button class="category-btn" onclick="document.getElementById('clearFilters').click()">🛍️ Show All Products</button></div>`;return}products.forEach(p=>{const id=p.id,stats=productStats[id]||{views:0,likes:0},images=Array.isArray(p.imageUrls)?p.imageUrls.filter(Boolean):[],first=images[0]||"",price=Number(p.price)||0,category=normalizeCategory(getProductCategory(p)),sold=p.sold===true||p.status==="sold";const card=document.createElement("div");card.className="product"+(sold?" sold":"");card.dataset.productId=id;card.innerHTML=`<div class="image-container" onclick="openProductImage('${id}')">${first?(first.toLowerCase().includes('.mp4')||first.toLowerCase().includes('.webm')||first.toLowerCase().includes('video')?`<video src="${escapeHTML(first)}" class="product-img" controls preload="metadata"></video>`:`<img src="${escapeHTML(first)}" class="product-img" alt="${escapeHTML(p.name||"Product")}" loading="lazy" onerror="this.src='https://via.placeholder.com/220x160?text=No+Image'">`):`<div style="height:100%;display:grid;place-items:center;color:#64748b">No image</div>`}<div class="product-stats"><span class="stat-badge">👁 ${stats.views.toLocaleString()}</span></div>${images.length>1?`<div class="image-counter">${images.length} items</div>`:""}</div><button class="share-button" onclick="event.stopPropagation();shareProduct('${id}')">📤</button><button class="like-button" onclick="event.stopPropagation();handleLike('${id}')">${userLikes[id]?"❤️":"🤍"}</button><div class="like-count">❤️ ${stats.likes}</div><div class="product-info"><div class="title">${escapeHTML(p.name||"Unnamed Product")}</div><span class="category-label">${escapeHTML(category)}</span><div class="price">₦${price.toLocaleString()}</div><div class="desc">${escapeHTML(p.description||"")}</div><button class="order-btn" onclick="openProductDetails('${id}')">👁 View Details</button>${sold?`<button class="order-btn" disabled style="background:#999;margin-top:6px">Sold Out</button>`:`<a href="https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(`Hello, I'm interested in: ${p.name||"this product"} - ₦${price.toLocaleString()}`)}" target="_blank" rel="noopener noreferrer" class="order-btn" style="margin-top:6px">💬 Order Now</a>`}</div>`;container.appendChild(card)})}
window.openProductImage=function(id){const p=allProducts.find(x=>x.id===id);if(!p)return;const imgs=Array.isArray(p.imageUrls)?p.imageUrls.filter(u=>u&&!/\.(mp4|webm)$/i.test(u)&&!String(u).toLowerCase().includes("video")):[];if(!imgs.length){openProductDetails(id);return}const modal=document.getElementById("imageModal"),img=document.getElementById("modalImage");let i=0;img.src=imgs[0];modal.style.display="block";document.body.style.overflow="hidden";document.getElementById("closeBtn").onclick=()=>{modal.style.display="none";document.body.style.overflow="auto"};document.getElementById("prevBtn").onclick=()=>{i=(i-1+imgs.length)%imgs.length;img.src=imgs[i]};document.getElementById("nextBtn").onclick=()=>{i=(i+1)%imgs.length;img.src=imgs[i]}}
window.openProductDetails=function(id){const p=allProducts.find(x=>x.id===id);if(!p)return;const imgs=Array.isArray(p.imageUrls)?p.imageUrls.filter(Boolean):[];document.getElementById("detailsImage").src=imgs[0]||"https://via.placeholder.com/600x400?text=No+Image";document.getElementById("detailsName").textContent=p.name||"Product";document.getElementById("detailsCategory").innerHTML=`<span class="category-label">${escapeHTML(normalizeCategory(getProductCategory(p)))}</span>`;const price=Number(p.price)||0;document.getElementById("detailsPrice").textContent=`₦${price.toLocaleString()}`;document.getElementById("detailsDescription").textContent=p.description||"Contact Akeem Store for more information.";document.getElementById("detailsOrder").href=`https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(`Hello, I'm interested in: ${p.name||"this product"} - ₦${price.toLocaleString()}`)}`;document.getElementById("detailsModal").style.display="block";document.body.style.overflow="hidden"}
window.handleLike=async function(id){userLikes[id]=!userLikes[id];productStats[id]??={views:0,likes:0};productStats[id].likes=Math.max(0,productStats[id].likes+(userLikes[id]?1:-1));updateStats();applyFilters();try{await updateDoc(doc(db,"products",id),{likes:increment(userLikes[id]?1:-1)})}catch(e){console.warn("Like update unavailable",e)}}
window.shareProduct=async function(id){const p=allProducts.find(x=>x.id===id);if(!p)return;const url=location.href.split('#')[0]+"#product-"+id;const text=`🛍️ AKEEM STORE\n\n📦 ${p.name||"Product"}\n💰 ₦${(Number(p.price)||0).toLocaleString()}\n\n${p.description||""}\n\n${url}`;if(navigator.share){try{await navigator.share({title:p.name||"Akeem Store",text,url});return}catch{}}try{await navigator.clipboard.writeText(text);alert("Product details copied successfully.")}catch{alert(text)}}
document.getElementById("closeBtn").onclick=()=>{document.getElementById("imageModal").style.display="none";document.body.style.overflow="auto"};document.getElementById("detailsClose").onclick=()=>{document.getElementById("detailsModal").style.display="none";document.body.style.overflow="auto"};document.getElementById("imageModal").onclick=e=>{if(e.target.id==="imageModal"){e.currentTarget.style.display="none";document.body.style.overflow="auto"}};document.getElementById("detailsModal").onclick=e=>{if(e.target.id==="detailsModal"){e.currentTarget.style.display="none";document.body.style.overflow="auto"}};document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.querySelectorAll(".modal,.details-modal").forEach(m=>m.style.display="none");document.body.style.overflow="auto"}});hamburger.onclick=()=>{hamburger.classList.toggle("active");mobileMenu.classList.toggle("active")};window.closeMenu=()=>{hamburger.classList.remove("active");mobileMenu.classList.remove("active")};searchBox.oninput=e=>{currentSearch=e.target.value.trim().toLowerCase();applyFilters()};sortSelect.onchange=e=>{currentSort=e.target.value;applyFilters()};clearFilters.onclick=()=>{selectedCategory="all";currentSearch="";currentSort="default";searchBox.value="";sortSelect.value="default";buildCategories();applyFilters()};
async function loadProducts(){resultsCount.textContent="Loading products...";try{const snap=await getDocs(collection(db,"products"));allProducts=snap.docs.map(d=>({...d.data(),id:d.id}));productStats={};allProducts.forEach(p=>productStats[p.id]={views:Number(p.views)||0,likes:Number(p.likes)||0});updateStats();updateActivityFeed();buildCategories();applyFilters();if(!allProducts.length)resultsCount.textContent="No products are currently listed."}catch(error){console.error("Akeem Store product load failed",error);resultsCount.textContent="Error loading products.";container.innerHTML=`<div class="no-results"><div class="no-results-icon">⚠️</div><h3>Could not load products</h3><p>${escapeHTML(error?.message||"Please refresh the page and try again.")}</p></div>`}}
setInterval(updateActivityFeed,15000);setInterval(()=>document.getElementById("onlineNowStat").textContent=generatedOnlineNumber(),12000);loadProducts();
</script>
<script>
/* Visual enhancements are intentionally isolated from the product boot. */
(function(){const load=()=>{["./blue-theme-final.js?v=20260821-5","./public-seller-link.js?v=20260821-6","./store-enhancements.js?v=20260820-4","./main-category-filter.js?v=20260820-9"].forEach(src=>{const s=document.createElement('script');s.src=src;s.defer=true;s.onerror=()=>console.warn('Optional visual module unavailable:',src);document.head.appendChild(s)})};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load()})();
</script>
